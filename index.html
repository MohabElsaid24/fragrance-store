<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping Cart | Perfume Store</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="css/all.css">
        <link href="https://fonts.cdnfonts.com/css/jomhuria" rel="stylesheet">
</head>
<body>
    <header class="header-section">
        <div class="header-parent">
            <div class="header-img">
                <a href="index.html"><img src="images/3541037.jpg" alt=""></a>
            </div>
            <div class="header-user-info" id="header-user-info">
                <span id="user-name">hello , mohab</span>
                <div class="cart-icon" id="cart-icone">
                    <i class="fa-solid fa-cart-shopping" id="cart-icone"></i>
                    <span class="countter" id="countter">0</span>
                    <div class="carts-products" id="carts-products">
                        <div class="carts-items" id="carts-items">

                            <p>your cart is empty now</p>
                        </div>
                        <a href="cart.html">view all products</a>
                    </div>
                </div>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
            <div class="header-links" id="header-links">
                <button class="login-btn"><a href="login.html">login</a></button>
                <button class="register-btn"><a href="register.html">register</a></button>
            </div>

        </div>
    </header>

    <section class="products">
        <div class="products-container">
            <div class="products-parent" id="products-parent">

                <div class="products-search">
                    <div class="products-selectbar">
                        <select name="search-select" id="product-catogory">
                            <option value="by-products">Search by product name</option>
                            <option value="by-catogory">Search by catogory</option>
                        </select>
                    </div>
                    <div class="products-searchbar">
                        <input type="text" id="search-input" placeholder="Search..">
                    </div>
                    <div class="products-searchbtn">
                        <button class="search-btn">Search</button>
                    </div>
                </div>

                <div class="products-items" id="products-items">
                </div>


            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
