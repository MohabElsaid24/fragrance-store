<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>login-page</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="css/all.css">
        <link href="https://fonts.cdnfonts.com/css/jomhuria" rel="stylesheet">
</head>
<body>

    <header class="header-section">
        <div class="header-parent">
            <div class="header-img">
                <a href="index.html"><img src="images/3541037.jpg" alt=""></a>
            </div>
            <div class="header-links" id="header-links">
                <button class="login-btn"><a href="login.html">login</a></button>
                <button class="register-btn"><a href="register.html">register</a></button>
            </div>
        </div>
    </header>

    <section class="main-section">
        <div class="main-container">
            <div class="main-parent">
                <div class="main-form">

                    <p>Email</p>
                    <input type="email" class="email" placeholder="Enter email" id="email">
                    <p>password</p>
                    <input type="password" class="password" placeholder="Enter password" id="password">
                    <div class="remember">
                        <input type="checkbox" name="" id="">
                        <span>Remember me</span>
                    </div>
                    <button class="btn-register" id="btn-login">Login</button>
                    <p>don't have an account? <a href="register.html" class="a-login">register</a></p>

                </div>
            </div>
        </div>
    </section>
    
    <script src="login.js"></script>
</body>
</html>
